<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>منيو المطعم</title>

  <style>
  :root {
    --primary-color: #c9a45c;
    --background-color: #111111;
    --card-color: #222222;
    --text-color: #ffffff;
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    padding: 20px;
    background: var(--background-color);
    color: var(--text-color);
    font-family: Arial, sans-serif;
  }

  header {
    text-align: center;
    padding: 25px 10px;
    border-bottom: 2px solid var(--primary-color);
    margin-bottom: 25px;
  }

  h1 {
    color: var(--primary-color);
  }

  #products {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
    gap: 20px;
    max-width: 1000px;
    margin: auto;
  }

  .card {
    background: var(--card-color);
    border: 1px solid var(--primary-color);
    border-radius: 12px;
    padding: 15px;
    overflow: hidden;
  }

  .card img {
    width: 100%;
    height: 180px;
    object-fit: cover;
    border-radius: 8px;
  }

  .card h3 {
    color: var(--primary-color);
  }

  .price {
    color: var(--primary-color);
    font-weight: bold;
    font-size: 19px;
  }

  #message {
    text-align: center;
    margin-top: 30px;
  }

  #menuHeader {
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    padding: 50px 20px;
    border-radius: 15px;
    margin-bottom: 25px;
  }

  #restaurantLogo {
    width: 100px;
    height: 100px;
    object-fit: contain;
    border-radius: 50%;
    margin-bottom: 15px;
    background: white;
    padding: 5px;
  }

  #restaurantName {
    font-size: 32px;
  }
</style>
</head>

<body>

  <header id="menuHeader">

    <img
      id="restaurantLogo"
      src=""
      alt="شعار المطعم"
      style="display:none;"
    >

    <h1 id="restaurantName">جاري تحميل المنيو...</h1>

    <p>اكتشف قائمة منتجاتنا</p>

  </header>

  <main id="products"></main>

  <p id="message"></p>

  <script type="module">

    import { initializeApp }
      from "https://www.gstatic.com/firebasejs/13.3.0/firebase-app.js";

    import {
      getFirestore,
      doc,
      getDoc,
      collection,
      getDocs,
      query,
      where
    } from "https://www.gstatic.com/firebasejs/13.3.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAH_JFFNU9qDKihPdOyNtL_zEcMwWSMOIM",
      authDomain: "smart-qr-system-5a587.firebaseapp.com",
      projectId: "smart-qr-system-5a587",
      storageBucket: "smart-qr-system-5a587.firebasestorage.app",
      messagingSenderId: "879059590632",
      appId: "1:879059590632:web:38ce57f677cb6fc1b5185d"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const restaurantId =
      new URLSearchParams(window.location.search).get("restaurant");

    const productsContainer = document.getElementById("products");
    const message = document.getElementById("message");

    async function loadMenu() {

      if (!restaurantId) {
        message.textContent = "رابط المنيو غير صحيح";
        return;
      }

      try {

        const restaurantRef = doc(db, "restaurants", restaurantId);
        const restaurantSnap = await getDoc(restaurantRef);

        if (!restaurantSnap.exists() || restaurantSnap.data().active !== true) {
          message.textContent = "هذا المطعم غير متاح حالياً";
          return;
        }

        // بيانات المطعم وإعدادات التصميم
const restaurant = restaurantSnap.data();
const design = restaurant.menuDesign || {};

// اسم المطعم
document.getElementById("restaurantName").textContent =
  restaurant.name || "مطعمنا";

// اللون الأساسي
const primaryColor = design.primaryColor || "#c9a45c";

// لون الخلفية
document.body.style.backgroundColor =
  design.backgroundColor || "#111111";

// تطبيق اللون على العنوان
document.getElementById("restaurantName").style.color =
  primaryColor;

// اللوجو
const logo = document.getElementById("restaurantLogo");

if (design.logo) {
  logo.src = design.logo;
  logo.style.display = "inline-block";
}

// صورة الغلاف
const header = document.getElementById("menuHeader");

if (design.coverImage) {
  header.style.backgroundImage =
    `linear-gradient(rgba(0,0,0,0.45), rgba(0,0,0,0.45)), url("${design.coverImage}")`;
}

// لون إطار الهيدر
header.style.borderColor = primaryColor;

        const productsRef =
          collection(db, "restaurants", restaurantId, "products");

        const productsQuery = query(
          productsRef,
          where("available", "==", true)
        );

        const productsSnap = await getDocs(productsQuery);

        if (productsSnap.empty) {
          message.textContent = "لا توجد منتجات متاحة حالياً";
          return;
        }

        productsSnap.forEach((productDoc) => {

          const product = productDoc.data();

          const card = document.createElement("div");
          card.className = "card";

          if (product.image) {
            const image = document.createElement("img");
            image.src = product.image;
            image.alt = product.name || "صورة المنتج";
            card.appendChild(image);
          }

          const name = document.createElement("h3");
          name.textContent = product.name || "";
          name.style.color = primaryColor;

          const category = document.createElement("p");
          category.textContent = product.category || "";

          const description = document.createElement("p");
          description.textContent = product.description || "";

          const price = document.createElement("p");
          price.className = "price";
          price.style.color = primaryColor;
          price.textContent = `${product.price} جنيه`;

          card.append(name, category, description, price);
          productsContainer.appendChild(card);

        });

      } catch (error) {
        console.error(error);
        message.textContent = "حصل خطأ أثناء تحميل المنيو";
      }
    }

    loadMenu();

  </script>

</body>
</html>
