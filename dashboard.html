<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SMART QR | Dashboard</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      background: #101114;
      color: white;
      padding: 25px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 15px;
      margin-bottom: 30px;
    }

    h1 {
      color: #f5a623;
    }

    button {
      padding: 11px 18px;
      border: none;
      border-radius: 8px;
      background: #f5a623;
      color: #171717;
      font-weight: bold;
      cursor: pointer;
    }

    .stats {
      background: #1b1c22;
      border: 1px solid #34353e;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 25px;
    }

    .products {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
      gap: 18px;
    }

    .card {
      background: #1b1c22;
      border: 1px solid #34353e;
      border-radius: 12px;
      padding: 20px;
    }

    .card h3 {
      color: #f5a623;
    }

    .muted {
      color: #aaa;
    }

    #message {
      margin: 20px 0;
      color: #f5a623;
    }
.design-settings {
  background: #222;
  padding: 20px;
  border-radius: 12px;
  margin: 25px 0;
}

.design-settings h2 {
  color: #c9a45c;
}

.design-settings label {
  display: block;
  margin-top: 15px;
}

.design-settings input {
  width: 100%;
  padding: 10px;
  margin-top: 5px;
  border-radius: 6px;
  border: none;
}

.design-settings button {
  margin-top: 20px;
  padding: 12px 25px;
  background: #c9a45c;
  border: none;
  border-radius: 6px;
  cursor: pointer;
  font-weight: bold;
}
    
  </style>
</head>

<body>

  <header>
    <div>
      <h1>SMART QR</h1>
      <p class="muted">لوحة تحكم المطعم</p>
    </div>

    <button id="logoutBtn">تسجيل الخروج</button>
  </header>

  <div class="stats">
    <h2 id="restaurantName">جاري تحميل المطعم...</h2>
    <p>إجمالي المنتجات: <strong id="productCount">0</strong></p>
  </div>
<div class="stats">
  <h2>إضافة منتج جديد</h2>

  <form id="addProductForm">

    <input
      type="text"
      id="productName"
      placeholder="اسم المنتج"
      required
    >

    <input
      type="text"
      id="productCategory"
      placeholder="القسم (Burger / Drinks)"
      required
    >

    <input
      type="text"
      id="productDescription"
      placeholder="وصف المنتج"
      required
    >

    <input
      type="number"
      id="productPrice"
      placeholder="السعر بالجنيه"
      min="0"
      required
    >

    <input
      type="text"
      id="productImage"
      placeholder="رابط الصورة أو إيموجي 🍔"
      required
    >

    <button type="submit">إضافة المنتج</button>

  </form>
</div>
<div class="stats">
  <h2>🎨 تخصيص تصميم المنيو</h2>

  <form id="designForm">

    <label>اسم المطعم</label>
    <input type="text" id="designName" placeholder="اسم المطعم">

    <label>رابط اللوجو</label>
    <input type="url" id="designLogo" placeholder="رابط صورة اللوجو">

    <label>اللون الأساسي</label>
    <input type="color" id="primaryColor" value="#c9a45c">

    <label>لون الخلفية</label>
    <input type="color" id="backgroundColor" value="#111111">

    <label>رابط صورة الغلاف</label>
    <input type="url" id="coverImage" placeholder="رابط صورة الغلاف">

    <button type="submit">حفظ التصميم</button>

  </form>
</div>
  
  <div id="message">جاري تحميل البيانات...</div>

  <div class="products" id="products"></div>

  <script type="module">

    import { initializeApp } from
      "https://www.gstatic.com/firebasejs/13.3.0/firebase-app.js";

    import {
      getAuth,
      onAuthStateChanged,
      signOut
    } from
      "https://www.gstatic.com/firebasejs/13.3.0/firebase-auth.js";

    import {
      getFirestore,
      doc,
      getDoc,
      collection,
      getDocs,
      addDoc,
      updateDoc,
      deleteDoc,
      query,
      where
    } from
      "https://www.gstatic.com/firebasejs/13.3.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAH_JFFNU9qDKihPdOyNtLZ_ecMwWSMOIM",
      authDomain: "smart-qr-system-5a587.firebaseapp.com",
      projectId: "smart-qr-system-5a587",
      storageBucket: "smart-qr-system-5a587.firebasestorage.app",
      messagingSenderId: "879059590632",
      appId: "1:879059590632:web:38ce57f677cb6fc1b5185d"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const message = document.getElementById("message");
    const productsDiv = document.getElementById("products");

    onAuthStateChanged(auth, async (user) => {

      if (!user) {
        window.location.href = "index.html";
        return;
      }

      try {

        const restaurantRef = doc(db, "restaurants", user.uid);
        const restaurantSnap = await getDoc(restaurantRef);
        console.log("Restaurant read successful:", restaurantSnap.exists());
        
        if (!restaurantSnap.exists()) {
          throw new Error("Restaurant not found");
        }

        const restaurant = restaurantSnap.data();
console.log("Logged UID:", user.uid);
console.log("Restaurant Owner:", restaurant.ownerId);
console.log("Restaurant Active:", restaurant.active);
        if (restaurant.ownerId !== user.uid || restaurant.active !== true) {
          throw new Error("Access denied");
        }

        document.getElementById("restaurantName").textContent =
          restaurant.name;

        const productsRef = collection(
          db,
          "restaurants",
          user.uid,
          "products"
        );

        const productsSnap = await getDocs(productsRef);
        
console.log("Products read successful:", productsSnap.size);
        document.getElementById("productCount").textContent =
          productsSnap.size;

        productsDiv.innerHTML = "";

        if (productsSnap.empty) {
          message.textContent = "لا توجد منتجات متاحة حتى الآن.";
        } else {
          message.textContent = "";

          productsSnap.forEach((productDoc) => {
  const product = productDoc.data();
  const productId = productDoc.id;

  const card = document.createElement("div");
  card.className = "card";

  const name = document.createElement("h3");
  name.textContent = product.name;

  const category = document.createElement("p");
  category.textContent = "القسم: " + product.category;

  const description = document.createElement("p");
  description.textContent = product.description;

  const price = document.createElement("p");
  price.textContent = "السعر: " + product.price + " جنيه";

  const image = document.createElement("p");
  image.textContent = product.image;

  const editBtn = document.createElement("button");
  editBtn.textContent = "تعديل";
  editBtn.style.margin = "5px";

  editBtn.onclick = async () => {
    const newName = prompt("اسم المنتج:", product.name);
    if (newName === null || !newName.trim()) return;

    const newPrice = prompt("السعر:", product.price);
    if (newPrice === null || newPrice.trim() === "" || !Number.isFinite(Number(newPrice)) || Number(newPrice) < 0) return;

    try {
      await updateDoc(
        doc(db, "restaurants", auth.currentUser.uid, "products", productId),
        {
          name: newName.trim(),
          price: Number(newPrice)
        }
      );

      alert("تم تعديل المنتج بنجاح");
      window.location.reload();

    } catch (error) {
      console.error(error);
      alert("فشل تعديل المنتج");
    }
  };

  const deleteBtn = document.createElement("button");
  deleteBtn.textContent = "حذف";
  deleteBtn.style.background = "#e74c3c";
  deleteBtn.style.margin = "5px";

  deleteBtn.onclick = async () => {
    if (!confirm("هل أنت متأكد من حذف المنتج؟")) return;

    try {
      await deleteDoc(
        doc(db, "restaurants", auth.currentUser.uid, "products", productId)
      );

      alert("تم حذف المنتج");
      window.location.reload();

    } catch (error) {
      console.error(error);
      alert("فشل حذف المنتج");
    }
  };
const toggleBtn = document.createElement("button");

toggleBtn.textContent = product.available
  ? "إخفاء المنتج 👁️"
  : "إظهار المنتج";

toggleBtn.style.margin = "5px";
toggleBtn.style.background = product.available ? "#777" : "#27ae60";

toggleBtn.onclick = async () => {
  try {
    await updateDoc(
      doc(db, "restaurants", auth.currentUser.uid, "products", productId),
      {
        available: !product.available
      }
    );

    alert(product.available ? "تم إخفاء المنتج" : "تم إظهار المنتج");

    window.location.reload();

  } catch (error) {
    console.error(error);
    alert("حدث خطأ أثناء تغيير حالة المنتج");
  }
};
 
  card.append(
  image,
  name,
  category,
  description,
  price,
  editBtn,
  deleteBtn,
  toggleBtn
  );

  productsDiv.appendChild(card);
});
        }

      } catch (error) {
        console.error(error);
        message.textContent =
          "حصلت مشكلة في تحميل البيانات. راجع إعدادات Firebase.";
      }

    });

    document.getElementById("logoutBtn").addEventListener("click", async () => {
      await signOut(auth);
      window.location.href = "index.html";
    });

    document.getElementById("addProductForm").addEventListener("submit", async (e) => {
  e.preventDefault();

  const user = auth.currentUser;

  if (!user) {
    alert("سجل الدخول أولاً");
    return;
  }

  const product = {
    name: document.getElementById("productName").value.trim(),
    category: document.getElementById("productCategory").value.trim(),
    description: document.getElementById("productDescription").value.trim(),
    price: Number(document.getElementById("productPrice").value),
    image: document.getElementById("productImage").value.trim(),
    available: true
  };

  try {
    await addDoc(
      collection(db, "restaurants", user.uid, "products"),
      product
    );

    alert("تمت إضافة المنتج بنجاح!");

    document.getElementById("addProductForm").reset();

    window.location.reload();

  } catch (error) {
    console.error(error);
    alert("فشلت إضافة المنتج. راجع صلاحيات Firebase.");
  }
});
  </script>

</body>
</html>
